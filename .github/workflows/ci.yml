name: Quality checks
on:
  push:
  pull_request:
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements/dev.txt
      - run: python -m maintenance.sync_versions --check
      - run: python -m evaluation.verify_itinerary_skills
      - run: python -m maintenance.validate_catalog
      - run: python -m evaluation.evaluate_generalization
      - run: python -m pytest -q tests plugins/skills
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm test
